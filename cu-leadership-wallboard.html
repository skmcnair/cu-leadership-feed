<!doctype html>
<!--
  CHARTER OAK WALLBOARD TEMPLATE  ·  single-file OptiDev board
  ===========================================================================
  One HTML file with no build step and no outside libraries. It draws a 1920 x 1080
  board that scales to fit any screen, reads a feed, and rotates through a loop of
  screens. Light and dark themes. Nothing in this file belongs to one topic: each
  board maps its own feed onto the neutral item format and picks screen patterns.

  THREE LAYERS
    1. Fixed (the shell): never changes from board to board.
         Header with the oak mark, board title, Live/Offline status and clock; the orange
         rotation bar; the frame and its heights; the footer layout; the data engine
         (feed checks, refresh, offline handling, new data starting at the top of the
         loop); the bookmark (OptiSigns reloads the board each time its playlist comes back
         to it, so the board picks up after the last screen that ran its full time);
         scaling, text fitting, logo tiles and brand tokens.
    2. Slots: fixed position and style, filled in per board or per screen.
         Board title, theme, timing, feed reader, field mapping, headline area, notes
         strip, sources line, AI notice (on or off per board; its accuracy figure comes
         from the feed, and it hides when the feed has none).
    3. Free: the body. Each screen uses one of the screen patterns below.

  SCREEN PATTERNS (general layouts, named by job, never by topic)
    overview  one big figure with label/value rows, and up to two ranked lists
    list      a paged table; each board chooses its columns
    feature   one item in depth: logo or image, key figure, name, facts
    compare   two items side by side and their combined result; rows level across all three
    media     a picture with text; the picture sizes to its shape and is never cropped
  A board that needs a new layout adds a new general pattern here, never a topic screen.

  NEUTRAL ITEM FORMAT (mapItem turns each feed item into this)
    kind ('item', 'compare' or 'media'), id, date, name, shortName, line, detail,
    category, region, org, orgShort, logoUrl, logoStyle, imageUrl, figure, figureLabel,
    facts [{ label, value }], initials, title, text, source, compare, featured,
    notes, sources, accuracy

  HOW TO MAKE A NEW BOARD
    1. Save a copy as <topic>-wallboard.html.
    2. Set CONFIG: title, theme, timing, feed address, AI notice.
    3. If the feed isn't a JSON list, change readFeed(). Point mapItem() at its fields.
    4. In buildScreens(), choose the patterns, their order and their words. Each screen is
         { pattern, hero: { tracker, dates, headline } or null, notes: { label, text } or null,
           sources, items (the items it shows; they set the AI notice), ...pattern data }
       Body height: 565px with headline and notes; 702px without notes; 707px without the
       headline; 844px without both. bodyHeight() returns it; the list pattern pages by it.
    5. Preview: leave FEED_URL blank for SAMPLE_DATA. In the address, ?screen=2 holds one
       screen (counting from 0), ?theme=light or ?theme=dark overrides the theme, and
       ?bookmark=clear starts the board over from the top.

  DESIGN RULES
    - Colors: only the tokens below, named as in the Charter Oak design system. Lighter
      shades come from transparency of a token, never a new hex value. Text on orange is
      always white.
    - Fonts: New Hero Bold for headings, numbers and labels; Elza Regular for everything
      else. Elza is never bold. Footers use the body font.
    - Orange is the highlight: the oak mark, the tracker line, the rotation bar and one key
      number per screen. Never a darker orange.
    - Square corners everywhere except round avatars and the live dot. No shadows,
      gradients, blur or animations other than the rotation bar.
    - Fixed heights keep rows level. Long one-line text shrinks to fit (class "wb-fit",
      data-min sets the smallest size); long blocks shrink, then end with an ellipsis
      (class "wb-clamp").
    - Every class name starts with "wb-" (modifiers with "is-" or "no-") so the board
      never clashes with the design system's own styles.
    - Dollar figures: billions from $1B up ($1.85B), millions below ($345M).
    - Every logo sits on a tile: white for color logos, slate for white-only logos.
      A logo that fails to load falls back to the short name.
    - Blanks show as "Not reported" or "Not stated". Never invent a value.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charter Oak Wallboard</title>
<style>
/* ---------- Brand tokens: same names and values as the Charter Oak design system ----------
   The board can't load the design system's stylesheet on the screen, so the values live here.
   New Hero and Elza come from the Charter Oak brand theme in OptiDev. To host the board
   anywhere else, add @font-face rules here that point at the licensed font files. */
:root {
  --brand-orange: #f58220;
  --brand-charcoal: #1a1f24;
  --brand-slate: #343c41;
  --brand-white: #ffffff;
  --tint-canvas: #f5f1ed;
  --tint-slate-mid: #57646d;
  --tint-fog: #b8bbbc;
  --tint-rule: #d6d8d9;
  --chart-3: #858a8d;
  --chart-4: #f9b98a;
  --chart-5: #2f6d8f;
  --chart-6: #c6c8ca;
  --status-on-track: #2e7d4f;
  --font-display: 'New Hero', 'New Hero Bold', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-text: 'Elza', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}
/* Theme roles. The --wb- roles are the board's own; the rest match the design system. */
html[data-theme="dark"] {
  --surface-canvas: var(--brand-charcoal);  /* board background */
  --surface-panel: var(--brand-slate);      /* panels, avatars, image backing */
  --text-primary: var(--brand-white);
  --text-muted: var(--tint-fog);            /* secondary text, footer */
  --text-accent: var(--brand-orange);
  --border-panel: var(--chart-6);           /* panel outlines */
  --border-rule: var(--tint-slate-mid);     /* hairlines (never text) */
  --chart-main: var(--chart-6);             /* first chart series */
  --wb-track: var(--brand-slate);           /* rotation bar track */
  --wb-rule-strong: var(--chart-6);         /* rule under table headers */
  --wb-tile-edge: transparent;              /* outline on white logo tiles */
}
html[data-theme="light"] {
  --surface-canvas: var(--tint-canvas);
  --surface-panel: var(--brand-white);
  --text-primary: var(--brand-charcoal);
  --text-muted: var(--tint-slate-mid);
  --text-accent: var(--brand-orange);
  --border-panel: var(--chart-6);
  --border-rule: var(--tint-rule);
  --chart-main: var(--brand-slate);
  --wb-track: var(--tint-rule);
  --wb-rule-strong: var(--brand-slate);
  --wb-tile-edge: var(--tint-rule);
}

/* ============================ FIXED: the shell ============================ */
html, body { margin: 0; height: 100%; background: var(--surface-canvas); overflow: hidden; }
.wb-board, .wb-board * { box-sizing: border-box; }
:where(.wb-board) :where(p, h1, h2, h3, dl, dd) { margin: 0; }   /* :where keeps this reset weaker than every wb- rule */

.wb-board {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px; transform-origin: 0 0;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface-canvas); color: var(--text-primary);
  font-family: var(--font-text); font-weight: 400;
}

/* Header: oak mark + board title left; status and clock right */
.wb-hdr { height: 112px; flex-shrink: 0; padding: 0 88px; display: flex; align-items: center; justify-content: space-between; gap: 48px; }
.wb-brand { display: flex; align-items: center; gap: 20px; min-width: 0; }
.wb-mark { width: 72px; height: 48px; flex-shrink: 0; display: flex; align-items: center; }
.wb-mark svg { display: block; width: 100%; height: 100%; }
.wb-mark:empty { display: none; }
.wb-hdr h1 { position: relative; top: 4px; /* centers the capitals on the oak mark's ink */
  font: 700 44px/1.1 var(--font-display); letter-spacing: -0.4px; white-space: nowrap; }
.wb-hdr-right { display: flex; align-items: center; gap: 40px; flex-shrink: 0; }
.wb-live { display: flex; align-items: center; gap: 12px; font-size: 22px; line-height: 1.2; color: var(--text-muted); white-space: pre; }
.wb-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--status-on-track); }
.wb-dot.is-off { background: var(--chart-3); }
.wb-vrule { width: 1px; height: 56px; background: var(--border-rule); }
.wb-clock { text-align: right; }
.wb-time { font: 700 48px/1 var(--font-display); letter-spacing: -0.4px; }
.wb-date { margin-top: 6px; font-size: 22px; line-height: 1.2; color: var(--text-muted); }

/* Rotation bar: fills orange over each screen's time */
.wb-timer { height: 6px; flex-shrink: 0; background: var(--wb-track); }
.wb-timer i { display: block; height: 100%; width: 0; background: var(--brand-orange); }

/* A screen: 962px tall. Headline area 144 + gap 32 + body + notes 137 + footer 84. */
.wb-screen { height: 962px; flex-shrink: 0; display: flex; flex-direction: column; }

/* Headline area (optional per screen): tracker line + dates, then a one-line headline */
.wb-hero { height: 144px; flex-shrink: 0; padding: 34px 88px 0; display: flex; flex-direction: column; }
.wb-hero-top { height: 26px; display: flex; justify-content: space-between; align-items: baseline; gap: 32px; }
.wb-tracker { font: 700 18px/1.2 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; white-space: pre; color: var(--text-accent); }
.wb-dates { font-size: 22px; line-height: 26px; white-space: pre; color: var(--text-muted); }
.wb-headline { margin-top: 4px; padding-top: 8px; padding-bottom: 14px; margin-bottom: -14px; /* room for ascenders and descenders inside the clip box */
  font: 700 68px/72px var(--font-display); letter-spacing: -0.6px; white-space: nowrap; overflow: hidden; }

/* Body: the free area. Its height depends on which slots the screen keeps. */
.wb-body { flex-shrink: 0; height: 565px; margin: 32px 88px 0; display: flex; align-items: flex-start; gap: 48px; }
.wb-screen.no-notes .wb-body { height: 702px; }
.wb-screen.no-hero .wb-body { margin-top: 34px; height: 707px; }
.wb-screen.no-hero.no-notes .wb-body { height: 844px; }

/* Notes strip (optional per screen): up to 3 lines with a run-in label; shrinks 22px -> 19px, then ellipsis */
.wb-notes { height: 105px; flex-shrink: 0; margin: 32px 88px 0; padding-top: 20px; border-top: 1px solid var(--border-rule); }
.wb-notes-text { font-size: 22px; line-height: 28px; max-height: 84px; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.wb-notes-label { margin-right: 16px; font: 700 16px/1 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); }

/* Footer: body font. Sources left; the AI notice's space on the right is always held. */
.wb-foot { height: 84px; flex-shrink: 0; margin: auto 88px 0; padding-bottom: 38px; display: flex; align-items: flex-end; gap: 48px;
  font-size: 16px; line-height: 1.2; color: var(--text-muted); }
.wb-foot-sources { flex: 1; min-width: 0; }
.wb-foot-ai { width: 600px; flex-shrink: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.wb-fit { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-clamp { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
.wb-empty { height: 962px; display: flex; align-items: center; justify-content: center; font: 700 44px/1.2 var(--font-display); color: var(--text-muted); }

/* ============================ Building blocks ============================ */
/* Caps label above a list, panel or figure */
.wb-label { margin-bottom: 12px; font: 700 16px/1.2 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); }
.wb-label.is-gap { margin-top: 32px; }

/* Panel with one big orange figure */
.wb-panel { padding: 28px 40px; background: var(--surface-panel); border: 1px solid var(--border-panel); display: flex; flex-direction: column; }
.wb-panel .wb-label { margin-bottom: 0; }
.wb-big { margin-top: 12px; font: 700 108px/0.95 var(--font-display); letter-spacing: -1.5px; color: var(--text-accent); white-space: nowrap; }
.wb-big.is-none { color: var(--text-muted); font-size: 44px; line-height: 1.1; letter-spacing: 0; }
.wb-cap { margin-top: 2px; font-size: 26px; line-height: 1.2; color: var(--text-muted); }

/* Label / value rows; the invisible strut keeps every row on the same baseline */
.wb-rows { margin-top: 24px; display: flex; flex-direction: column; border-bottom: 1px solid var(--border-rule); }
.wb-row { height: 56px; padding-top: 10px; display: flex; align-items: baseline; border-top: 1px solid var(--border-rule); }
.wb-row::before { content: '\200b'; font: 700 36px/1.1 var(--font-display); }
.wb-row dt { margin-right: auto; font-size: 22px; line-height: 1.2; color: var(--text-muted); white-space: nowrap; }
.wb-row dd { min-width: 0; margin-left: 16px; font: 700 36px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-row dd.is-muted { font: 400 24px/1.2 var(--font-text); color: var(--text-muted); }

/* Ranked list: name left, count right; .is-hl marks the one highlighted row */
.wb-list { display: flex; flex-direction: column; border-top: 1px solid var(--border-rule); }
.wb-rank { height: 62px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--border-rule); }
.wb-rank-sw { width: 26px; height: 26px; flex-shrink: 0; }
.wb-rank-name { flex: 1; min-width: 0; font-size: 28px; line-height: 1.3; }
.wb-rank-count { font: 700 42px/1 var(--font-display); }
.wb-rank.is-hl .wb-rank-name { font: 700 28px/1.3 var(--font-display); }
.wb-rank.is-hl .wb-rank-count { color: var(--text-accent); }
.wb-rank.is-sm { height: 52px; }
.wb-rank.is-sm .wb-rank-name { font-size: 26px; }
.wb-rank.is-sm .wb-rank-count { font-size: 32px; }

/* Stat strip: up to 4 numbers with labels */
.wb-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-top: 14px; border-top: 1px solid var(--border-rule); }
.wb-stat-n { font: 700 40px/1.1 var(--font-display); }
.wb-stat-n.is-accent { color: var(--text-accent); }
.wb-stat-l { margin-top: 4px; font-size: 20px; line-height: 1.3; color: var(--text-muted); white-space: nowrap; }

/* Logo tiles: white for color logos, slate (.is-on-dark) for white-only logos, in both themes.
   Sizes: .wb-tile (table row), .wb-logo-md (compare), .wb-logo-lg (feature). */
.wb-tile { width: 156px; height: 44px; flex-shrink: 0; padding: 6px 12px; background: var(--brand-white); border: 1px solid var(--wb-tile-edge);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.wb-tile img { max-width: 100%; max-height: 32px; object-fit: contain; }
.wb-logo-md, .wb-logo-lg { flex-shrink: 0; background: var(--brand-white); border: 1px solid var(--wb-tile-edge);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.wb-logo-md { height: 150px; padding: 24px 48px; }
.wb-logo-md img { max-width: 100%; max-height: 100px; object-fit: contain; }
.wb-logo-lg { height: 300px; padding: 40px 72px; }
.wb-logo-lg img { max-width: 100%; max-height: 190px; object-fit: contain; }
.wb-tile.is-on-dark, .wb-logo-md.is-on-dark, .wb-logo-lg.is-on-dark { background: var(--brand-slate); border-color: var(--brand-slate); }
.wb-fallback { font: 700 15px/1.15 var(--font-display); color: var(--brand-charcoal); text-align: center; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.wb-logo-md .wb-fallback { font-size: 34px; }
.wb-logo-lg .wb-fallback { font-size: 52px; }
.is-on-dark .wb-fallback { color: var(--brand-white); }

/* Image box: pictures are never cropped; the box sizes to the picture */
.wb-image { flex-shrink: 0; overflow: hidden; background: var(--surface-panel); display: flex; align-items: center; justify-content: center; }
.wb-image img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

/* Round initials avatar (headshots are always round) */
.wb-avatar { width: 150px; height: 150px; flex-shrink: 0; border-radius: 50%; background: var(--surface-panel); border: 1px solid var(--border-panel);
  display: flex; align-items: center; justify-content: center; font: 700 54px/1 var(--font-display); }
.wb-avatar.is-sm { width: 64px; height: 64px; font-size: 22px; }

/* Caps badge (category) */
.wb-badge { font: 700 15px/1.3 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; white-space: nowrap; color: var(--text-muted); }
.wb-badge.is-strong { color: var(--text-primary); }

/* Data table: 64px rows under a 40px header; 8 rows fit the 565px body */
.wb-table-wrap { flex: 1; min-width: 0; }
table.wb-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.wb-table th { padding: 0 16px 10px 0; text-align: left; vertical-align: bottom; white-space: nowrap; color: var(--text-muted);
  font: 700 15px/1.3 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; }
.wb-table thead tr { height: 40px; border-bottom: 2px solid var(--wb-rule-strong); }
.wb-table tbody tr { height: 64px; }
.wb-table td { padding: 0 16px 0 0; vertical-align: middle; border-bottom: 1px solid var(--border-rule); }
.wb-table th:last-child, .wb-table td:last-child { padding-right: 0; }
.wb-table .is-right { text-align: right; }
.wb-table tr.is-group-end td { border-bottom: 2px solid var(--chart-3); }
.wb-org { display: flex; align-items: center; gap: 14px; min-width: 0; }
.wb-org-tag { min-width: 0; font: 700 20px/1.3 var(--font-display); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-cell-strong { font: 700 24px/1.3 var(--font-display); }
.wb-cell-text { font-size: 22px; line-height: 1.3; }
.wb-cell-sub { font-size: 17px; line-height: 1.3; color: var(--text-muted); }
.wb-cell-date { font-size: 20px; line-height: 1.3; color: var(--text-muted); white-space: nowrap; }
.wb-cell-number { font: 700 28px/1.2 var(--font-display); white-space: nowrap; }

/* Fact list: label left, value right, 100px rows */
.wb-facts { display: flex; flex-direction: column; border-bottom: 1px solid var(--border-rule); }
.wb-fact { height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 32px; border-top: 1px solid var(--border-rule); }
.wb-fact dt { flex-shrink: 0; font-size: 24px; line-height: 1.3; color: var(--text-muted); white-space: nowrap; }
.wb-fact dd { min-width: 0; text-align: right; font-size: 30px; line-height: 1.3; }
.wb-fact dd.is-muted { color: var(--text-muted); }

/* ============================ Screen patterns ============================ */
/* OVERVIEW: figure panel left (rows pinned to its foot), ranked lists right */
.wb-ov-panel { width: 640px; height: 100%; flex-shrink: 0; }
.wb-ov-panel .wb-rows { margin-top: auto; }
.wb-ov-aside { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* LIST: the table fills the body; columns come from the screen */

/* FEATURE: logo or image and key figure left; name and facts right */
.wb-ft-left { width: 840px; height: 100%; flex-shrink: 0; display: flex; flex-direction: column; }
.wb-ft-left .wb-image { height: 300px; }
.wb-ft-fig { margin-top: auto; display: flex; flex-direction: column; }
.wb-ft-right { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.wb-ft-who { height: 164px; flex-shrink: 0; display: flex; align-items: flex-start; gap: 32px; }
.wb-ft-id { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: 6px; }
.wb-ft-kicker { font: 700 16px/1.2 var(--font-display); letter-spacing: 1.2px; text-transform: uppercase; white-space: pre; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
.wb-ft-name { margin-top: 8px; font: 700 60px/68px var(--font-display); letter-spacing: -0.5px; }
.wb-ft-line { margin-top: 4px; font-size: 26px; line-height: 1.2; color: var(--text-muted); }
.wb-ft-right .wb-facts { margin-top: auto; }

/* COMPARE: two items and their combined result; every row sits at the same height in all three columns */
.wb-cmp { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 600px; column-gap: 48px; }
.wb-cmp-col { min-width: 0; display: flex; flex-direction: column; }
.wb-cmp-head { height: 292px; flex-shrink: 0; display: flex; flex-direction: column; }
.wb-cmp-name { margin-top: 22px; max-height: 84px; font: 700 34px/42px var(--font-display); letter-spacing: -0.3px; }   /* up to 2 lines */
.wb-cmp-line { margin-top: 2px; font-size: 22px; line-height: 28px; color: var(--text-muted); }
.wb-cmp .wb-rows { margin-top: 0; }
.wb-cmp-panel { height: 100%; padding-top: 0; }
.wb-cmp-panel .wb-cmp-head { height: 291px; padding-top: 28px; justify-content: flex-start; }   /* 1px less: the panel's top border */
.wb-cmp-panel .wb-big { margin-top: 14px; }

/* MEDIA: picture and text side by side; the picture box takes the picture's shape */
.wb-md { width: 100%; height: 100%; display: flex; gap: 56px; }
.wb-md .wb-image { align-self: flex-start; width: 0; height: 0; }   /* sized from the picture once it loads */
.wb-md-text { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.wb-md-body { flex: 0 1 auto; min-height: 0; margin-top: 4px; font-size: 32px; line-height: 1.32; }
.wb-md.is-text-only .wb-md-body { font-size: 44px; line-height: 1.3; }
.wb-md-tags { flex-shrink: 0; margin-top: 20px; font-size: 22px; line-height: 1.3; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="wb-board" id="wb-board">
  <header class="wb-hdr">
    <div class="wb-brand">

// The default reads a JSON list, or an object with an "items" list (and an optional "accuracy").
// Replace it for RSS or any other format; refresh and offline handling stay the same.
// ============================================================================
function readFeed(text) {
  var data = JSON.parse(text);
  if (Array.isArray(data)) return data;
  return { items: data && Array.isArray(data.items) ? data.items : [], accuracy: data ? data.accuracy : null };
}

    figure:      raw.figure || '',                // one key figure, already formatted, e.g. $1.85B

    facts:       Array.isArray(raw.facts) ? raw.facts : [],   // [{ label, value }]

    title:       raw.title || '',                 // media: the post's title or first line

    tags:        raw.tags || '',                  // media: hashtags or a short trailing line
    source:      raw.source || '',                // media: who posted it

    featured:    raw.featured === true || raw.featured === 'yes',
    notes:       raw.notes || '',

      b: { name: LONG_ORG, short_name: 'Long Name Org', line: 'Region East', values: ['$1.50B', '96,500', '', 'Value'] },
      result: { label: 'Combined', figure: '$3.35B', caption: 'combined first measure', values: ['$3.35B', '238,500', '', 'Value'] }
    } },
  { kind: 'media', id: 'm1', date: daysAgo(2), source: 'Sample Source', accuracy: '96%',
    title: 'Media headline: the post\'s title or its first line', image_url: placeholderImage(1600, 900),
    text: 'Post text goes here. A wide picture sits on the left at its own shape, never cropped, and the text takes the rest of the width. Longer posts shrink a little and then end with an ellipsis, so a long post never pushes anything off the screen. This sample runs long on purpose to show that behavior at full size, with enough words to fill the column and keep going past the point where the text has to stop and end cleanly.',
    tags: '#placeholder #sample #hashtags' },

];

var STATE_NAMES = {
  AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado', CT:'Connecticut',
  DE:'Delaware', DC:'District of Columbia', FL:'Florida', GA:'Georgia', HI:'Hawaii', ID:'Idaho', IL:'Illinois',
  IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana', ME:'Maine', MD:'Maryland',
  MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri', MT:'Montana',
  NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey', NM:'New Mexico', NY:'New York',
  NC:'North Carolina', ND:'North Dakota', OH:'Ohio', OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania',
  RI:'Rhode Island', SC:'South Carolina', SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah',
  VT:'Vermont', VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming', PR:'Puerto Rico'
};
// Chart colors in order; each theme sets what they resolve to
var SERIES = ['var(--chart-main)', 'var(--chart-4)', 'var(--chart-3)', 'var(--chart-5)', 'var(--border-rule)'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function joinList(a) { return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return iso(new Date()); }
function addDays(isoDate, n) { var p = isoDate.split('-').map(Number); return iso(new Date(p[0], p[1] - 1, p[2] + n)); }
function daysAgo(n) { return addDays(today(), -n); }
function parseIso(s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function shortDate(s) { return s ? parseIso(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
function longDate(s) { return s ? parseIso(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function stateName(code) { return STATE_NAMES[code] || code || ''; }
function isNum(v) { return typeof v === 'number' && isFinite(v); }
function initials(name) {
  var w = String(name || '').replace(/[.,]/g, ' ').trim().split(/\s+/)
    .filter(function (t) { return t && !/^(jr|sr|ii|iii|iv|dr|[a-z])$/i.test(t); });
  return w.length ? (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase() : '';
}
// Dollar figures given in millions -> "$1.85B" from $1B up, "$345M" below
function money(millions) {
  if (!isNum(millions)) return '';
  return millions >= 1000 ? '$' + (millions / 1000).toFixed(2) + 'B' : '$' + Math.round(millions) + 'M';
}
// "$1.85B" -> 1850, "$345M" -> 345
function toMillions(s) {
  var m = /\$\s*([\d.,]+)\s*([BM])/i.exec(s || '');
  if (!m) return NaN;
  var v = parseFloat(m[1].replace(/,/g, ''));
  return m[2].toUpperCase() === 'B' ? v * 1000 : v;
}
// "92%", "92" or 0.92 -> 92; anything else -> null
function toPercent(v) {
  if (v == null || v === '') return null;
  var n = parseFloat(String(v).replace('%', ''));
  if (!isFinite(n)) return null;
  if (n > 0 && n <= 1 && !/%/.test(String(v))) n = n * 100;
  return Math.max(0, Math.min(100, n));
}
function countBy(items, key) {
  var c = {};
  items.forEach(function (it) { if (it[key]) c[it[key]] = (c[it[key]] || 0) + 1; });
  return c;
}
function ranked(counts) {
  return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); })
    .map(function (k) { return { name: k, count: counts[k] }; });
}
// Body height for a screen: 565 with headline and notes, 702 without notes, 707 without headline, 844 without both
function bodyHeight(hasHero, hasNotes) { return hasHero ? (hasNotes ? 565 : 702) : (hasNotes ? 707 : 844); }
// Placeholder artwork for the sample data only: a neutral picture and a neutral logo, drawn as SVG
function placeholderImage(w, h) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<rect width="' + w + '" height="' + h + '" fill="#57646d"/>' +
    '<path d="M0 0L' + w + ' ' + h + 'M' + w + ' 0L0 ' + h + '" stroke="#858a8d" stroke-width="' + Math.round(w / 300) + '"/>' +
    '<text x="50%" y="50%" dy="0.35em" text-anchor="middle" font-family="Arial, sans-serif" font-size="' + Math.round(w / 18) + '" fill="#d6d8d9">Picture ' + w + ' × ' + h + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function placeholderLogo(ink) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">' +
    '<circle cx="50" cy="50" r="34" fill="none" stroke="' + ink + '" stroke-width="10"/>' +
    '<text x="102" y="68" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="' + ink + '">LOGO</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function heroHTML(h) {
  return '<section class="wb-hero"><div class="wb-hero-top"><p class="wb-tracker">' + esc(h.tracker) + '</p><p class="wb-dates">' + esc(h.dates || '') + '</p></div>' +
    '<h2 class="wb-headline wb-fit" data-min="44">' + esc(h.headline) + '</h2></section>';
}
function notesHTML(n) {
  return '<section class="wb-notes" aria-label="' + esc(n.label) + '">' +
    (n.text ? '<p class="wb-notes-text"><span class="wb-notes-label">' + esc(n.label) + '</span>' + esc(n.text) + '</p>' : '') + '</section>';
}
function aiNotice(items) {
  if (!CONFIG.AI_NOTICE) return '';
  var vals = (items || []).map(function (it) { return it.accuracy; }).filter(isNum);
  // The items on this screen carry their own figures: show their average. Otherwise use the feed's one figure.
  var pct = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : feedAccuracy;
  // No figure in the feed: hide the notice (its space stays held). Never make a number up.
  return isNum(pct) ? 'This information was aggregated by AI and carries an estimated ' + Math.round(pct) + '% accuracy' : '';
}
function footHTML(sources, items) {
  return '<footer class="wb-foot"><p class="wb-foot-sources wb-fit" data-min="13">' + esc(sources || '') + '</p>' +
    '<p class="wb-foot-ai">' + esc(aiNotice(items)) + '</p></footer>';
}
function screenHTML(s) {
  var cls = 'wb-screen' + (s.hero ? '' : ' no-hero') + (s.notes ? '' : ' no-notes');
  return '<div class="' + cls + '">' +
    (s.hero ? heroHTML(s.hero) : '') +
    '<main class="wb-body">' + PATTERNS[s.pattern](s) + '</main>' +
    (s.notes ? notesHTML(s.notes) : '') +
    footHTML(s.sources, s.items) +

}

// Building-block helpers
// size: 'wb-tile' (table row), 'wb-logo-md' (compare) or 'wb-logo-lg' (feature).
// x needs logoUrl, logoStyle and a short name for the fallback.
function logoHTML(size, x) {
  var cls = size + (x.logoStyle === 'white' ? ' is-on-dark' : '');
  var short = x.orgShort || x.shortName || x.name || '';
  var inner = x.logoUrl
    ? '<img src="' + esc(x.logoUrl) + '" alt="' + esc(short) + ' logo" data-name="' + esc(short) + '">'
    : '<span class="wb-fallback">' + esc(short) + '</span>';
  return '<div class="' + cls + '">' + inner + '</div>';
}
function rowHTML(label, value, fallback) {
  var v = value || fallback || '';
  return '<div class="wb-row"><dt>' + esc(label) + '</dt><dd' + (value ? '' : ' class="is-muted"') + '>' + esc(v) + '</dd></div>';
}
function factHTML(label, value, fallback) {
  return '<div class="wb-fact"><dt>' + esc(label) + '</dt><dd class="wb-fit' + (value ? '' : ' is-muted') + '" data-min="20">' + esc(value || fallback) + '</dd></div>';
}
function rankHTML(r, i, swatches, small) {
  var sw = swatches ? '<span class="wb-rank-sw" style="background:' + (r.hl ? 'var(--brand-orange)' : SERIES[i % SERIES.length]) + '"></span>' : '';
  return '<div class="wb-rank' + (r.hl ? ' is-hl' : '') + (small ? ' is-sm' : '') + '">' + sw +
    '<span class="wb-rank-name wb-fit">' + esc(r.name) + '</span><span class="wb-rank-count">' + esc(r.count) + '</span></div>';
}

// ============================================================================
// FREE: the screen patterns. Each draws the body from the screen's data.
// ============================================================================
var PATTERNS = {

  // OVERVIEW. Screen data: figure { label, value, caption }, rows [{ label, value }] (up to 4),
  // lists [{ label, rows: [{ name, count, hl }], swatches }] (up to 2; first up to 4 rows, second up to 3)
  overview: function (s) {
    var f = s.figure || {};
    var lists = (s.lists || []).slice(0, 2).map(function (l, li) {
      var max = li === 0 ? 4 : 3;
      return '<p class="wb-label' + (li ? ' is-gap' : '') + '">' + esc(l.label) + '</p><div class="wb-list">' +
        l.rows.slice(0, max).map(function (r, i) { return rankHTML(r, i, l.swatches, li > 0); }).join('') + '</div>';
    }).join('');
    return '<section class="wb-panel wb-ov-panel">' +
        '<p class="wb-label">' + esc(f.label) + '</p>' +
        (f.value !== '' && f.value != null ? '<p class="wb-big">' + esc(f.value) + '</p>' : '<p class="wb-big is-none">Not reported</p>') +
        (f.caption ? '<p class="wb-cap">' + esc(f.caption) + '</p>' : '') +
        '<dl class="wb-rows">' + (s.rows || []).slice(0, 4).map(function (r) { return rowHTML(r.label, r.value, 'Not reported'); }).join('') + '</dl>' +
      '</section>' +
      '<aside class="wb-ov-aside">' + lists + '</aside>';
  },

  // LIST. Screen data: columns [{ label, kind, field, sub, width, align }], rows (items), groupBy (a field name or '')
  // Column kinds: 'org' (logo tile + optional tag field), 'badge', 'strong', 'text' (+ optional sub field),
  // 'date', 'number'. Width in px; leave one column without a width so it takes the rest.
  list: function (s) {
    var cols = s.columns;
    var colgroup = '<colgroup>' + cols.map(function (c) { return '<col' + (c.width ? ' style="width:' + c.width + 'px"' : '') + '>'; }).join('') + '</colgroup>';
    var head = '<thead><tr>' + cols.map(function (c) {
      return '<th' + (c.align === 'right' ? ' class="is-right"' : '') + '>' + esc(c.label) + '</th>';
    }).join('') + '</tr></thead>';
    var body = s.rows.map(function (it, i) {
      var last = s.groupBy && (i === s.rows.length - 1 || s.rows[i + 1][s.groupBy] !== it[s.groupBy]);
      return '<tr' + (last ? ' class="is-group-end"' : '') + '>' + cols.map(function (c) {
        var v = it[c.field] || '', cell;
        if (c.kind === 'org') cell = '<div class="wb-org">' + logoHTML('wb-tile', it) + (c.sub ? '<span class="wb-org-tag">' + esc(it[c.sub] || '') + '</span>' : '') + '</div>';
        else if (c.kind === 'badge') cell = '<span class="wb-badge' + (it.featured ? ' is-strong' : '') + '">' + esc(v) + '</span>';
        else if (c.kind === 'strong') cell = '<p class="wb-cell-strong wb-fit" data-min="20">' + esc(v) + '</p>';
        else if (c.kind === 'date') cell = '<span class="wb-cell-date">' + esc(shortDate(v)) + '</span>';
        else if (c.kind === 'number') cell = v ? '<span class="wb-cell-number">' + esc(v) + '</span>' : '<span class="wb-cell-date">Not reported</span>';
        else cell = '<p class="wb-cell-text wb-fit" data-min="18">' + esc(v) + '</p>' + (c.sub && it[c.sub] ? '<p class="wb-cell-sub wb-fit" data-min="15">' + esc(it[c.sub]) + '</p>' : '');
        return '<td' + (c.align === 'right' ? ' class="is-right"' : '') + '>' + cell + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="wb-table-wrap"><table class="wb-table">' + colgroup + head + '<tbody>' + body + '</tbody></table></div>';
  },

  // FEATURE. Screen data: item (uses logo or imageUrl, figure, figureLabel, category, line, name, initials, region, facts)
  feature: function (s) {
    var it = s.item;
    var visual = it.imageUrl ? '<div class="wb-image"><img src="' + esc(it.imageUrl) + '" alt=""></div>' : logoHTML('wb-logo-lg', it);
    var kicker = [it.category, it.region].filter(Boolean).join('  ·  ');
    var facts = (it.facts || []).slice(0, 4);
    return '<div class="wb-ft-left">' + visual +
        '<div class="wb-ft-fig"><p class="wb-label">' + esc(it.figureLabel || 'Key figure') + '</p>' +
          (it.figure ? '<p class="wb-big">' + esc(it.figure) + '</p>' : '<p class="wb-big is-none">Not reported</p>') +
          '<p class="wb-cap">' + esc(it.orgShort || '') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="wb-ft-right">' +
        '<div class="wb-ft-who">' + (it.initials ? '<div class="wb-avatar" aria-hidden="true">' + esc(it.initials) + '</div>' : '') +
          '<div class="wb-ft-id"><p class="wb-ft-kicker">' + esc(kicker) + '</p>' +
          '<p class="wb-ft-name wb-fit" data-min="36">' + esc(it.name) + '</p><p class="wb-ft-line wb-fit" data-min="18">' + esc(it.line) + '</p></div></div>' +
        '<dl class="wb-facts">' + facts.map(function (f) { return factHTML(f.label, f.value, 'Not stated'); }).join('') + '</dl>' +
      '</div>';
  },

  // COMPARE. Screen data: item.compare = { labels: [...], a, b, result }
  //   a, b:   { name, short_name, line, logo_url, logo_style, values: [one per label] }
  //   result: { label, figure, caption, values: [one per label] }
  compare: function (s) {
    var c = s.item.compare, labels = (c.labels || []).slice(0, 5);
    function side(x) {
      var logo = { logoUrl: x.logo_url || '', logoStyle: x.logo_style || 'color', shortName: x.short_name || x.name };
      return '<div class="wb-cmp-col"><div class="wb-cmp-head">' + logoHTML('wb-logo-md', logo) +
          '<p class="wb-cmp-name wb-clamp" data-min="28">' + esc(x.name) + '</p><p class="wb-cmp-line wb-fit" data-min="16">' + esc(x.line || '') + '</p></div>' +
        '<dl class="wb-rows">' + labels.map(function (l, i) { return rowHTML(l, (x.values || [])[i], 'Not reported'); }).join('') + '</dl></div>';
    }
    var r = c.result || {};
    return '<div class="wb-cmp">' + side(c.a || {}) + side(c.b || {}) +
      '<section class="wb-panel wb-cmp-panel"><div class="wb-cmp-head"><p class="wb-label">' + esc(r.label || 'Combined') + '</p>' +
          (r.figure ? '<p class="wb-big">' + esc(r.figure) + '</p>' : '<p class="wb-big is-none">Not reported</p>') +
          (r.caption ? '<p class="wb-cap">' + esc(r.caption) + '</p>' : '') + '</div>' +
        '<dl class="wb-rows">' + labels.map(function (l, i) { return rowHTML(l, (r.values || [])[i], 'Not reported'); }).join('') + '</dl>' +
      '</section></div>';
  },

  // MEDIA. Screen data: item (uses imageUrl, source, text, tags). The picture keeps its shape: at most 1000px wide
  // and the body's height, enlarged no more than 2x. With no picture the text is set larger across the body.
  media: function (s) {
    var it = s.item;
    return '<div class="wb-md' + (it.imageUrl ? '' : ' is-text-only') + '">' +
      (it.imageUrl ? '<div class="wb-image"><img src="' + esc(it.imageUrl) + '" alt="" data-fit-box="1000"></div>' : '') +
      '<div class="wb-md-text"><p class="wb-label">' + esc(it.source) + '</p>' +
        '<p class="wb-md-body wb-clamp" data-min="' + (it.imageUrl ? 26 : 34) + '">' + esc(it.text) + '</p>' +
        (it.tags ? '<p class="wb-md-tags">' + esc(it.tags) + '</p>' : '') +
      '</div></div>';
  }
};

// ============================================================================
// SLOT: the loop. Turns the feed into an ordered list of screens.
// This is where a board's topic lives: which patterns, in what order, with what words.
// The sample below shows every pattern once (the list runs to two pages).
// ============================================================================
function buildScreens(rawItems) {
  var all = rawItems.map(mapItem).filter(function (it) { return it.date; });
  var end = today();
  var start = CONFIG.WINDOW_DAYS ? addDays(end, -(CONFIG.WINDOW_DAYS - 1)) : '';
  if (CONFIG.WINDOW_DAYS) {
    var recent = all.filter(function (it) { return it.date >= start && it.date <= end; });
    if (!recent.length && all.length) {   // nothing recent: show the last window that has data
      end = all.reduce(function (m, it) { return it.date > m ? it.date : m; }, '');
      start = addDays(end, -(CONFIG.WINDOW_DAYS - 1));
      recent = all.filter(function (it) { return it.date >= start && it.date <= end; });
    }
    all = recent;
  }
  all.sort(function (a, b) { return b.date.localeCompare(a.date); });
  var items = all.filter(function (it) { return it.kind === 'item'; });
  var compares = all.filter(function (it) { return it.kind === 'compare' && it.compare; });
  var media = all.filter(function (it) { return it.kind === 'media'; });
  var screens = [];
  if (!all.length) return { screens: screens };
  var rangeText = (start ? shortDate(start) : shortDate(all[all.length - 1].date)) + ' – ' + longDate(all[0].date);

  // Items grouped by organization, each organization's newest item first
  var groups = {}, order = [];
  items.forEach(function (it) { if (!groups[it.org]) { groups[it.org] = []; order.push(it.org); } groups[it.org].push(it); });
  var listRows = [].concat.apply([], order.map(function (o) { return groups[o]; }));
  var largest = items.filter(function (it) { return isFinite(toMillions(it.figure)); })
    .sort(function (a, b) { return toMillions(b.figure) - toMillions(a.figure); })[0];
  var featured = items.filter(function (it) { return it.featured; });

  if (items.length) {
    screens.push({ pattern: 'overview',
      hero: { tracker: 'Overview  |  Last ' + CONFIG.WINDOW_DAYS + ' days', dates: rangeText,
              headline: plural(items.length, 'item') + ' from ' + plural(order.length, 'organization') },
      figure: { label: 'Organizations', value: order.length, caption: 'across ' + plural(Object.keys(countBy(items, 'region')).length, 'region') },
      rows: [ { label: 'Items', value: String(items.length) },
              { label: 'Featured items', value: String(featured.length) },
              { label: 'Largest key figure', value: largest ? largest.orgShort : '' },
              { label: 'Its value', value: largest ? largest.figure : '' } ],
      lists: [ { label: 'By category', rows: ranked(countBy(items, 'category')), swatches: true },
               { label: 'By region', rows: ranked(countBy(items, 'region')) } ],
      notes: { label: 'Notes', text: 'Overview pattern: one big figure with up to four rows, and up to two ranked lists. The board chooses every word and number.' },
      sources: CONFIG.SOURCES_LINE, items: items });

    var perPage = Math.floor((bodyHeight(true, true) - 40) / 64);   // 8 rows fit with headline and notes
    var pages = Math.ceil(listRows.length / perPage);
    for (var p = 0; p < pages; p++) {
      var rows = listRows.slice(p * perPage, (p + 1) * perPage);
      screens.push({ pattern: 'list',
        hero: { tracker: 'List  |  Newest first', dates: rangeText + (pages > 1 ? '   ·   Page ' + (p + 1) + ' of ' + pages : ''),
                headline: plural(items.length, 'item') + ', grouped by organization' },
        columns: [ { label: 'Organization', kind: 'org', field: 'org', sub: 'region', width: 380 },
                   { label: 'Category', kind: 'badge', field: 'category', width: 200 },
                   { label: 'Name', kind: 'strong', field: 'name', width: 470 },
                   { label: 'Detail', kind: 'text', field: 'line', sub: 'detail' },
                   { label: 'Figure', kind: 'number', field: 'figure', width: 150, align: 'right' },
                   { label: 'Date', kind: 'date', field: 'date', width: 110, align: 'right' } ],
        rows: rows, groupBy: 'org', page: p + 1,
        notes: { label: 'Notes', text: 'List pattern: the board picks the columns. Rows are grouped by organization here, with a heavier rule after each group.' },
        sources: CONFIG.SOURCES_LINE, items: rows });
    }

    featured.forEach(function (it) {
      screens.push({ pattern: 'feature',
        hero: { tracker: 'Feature  |  ' + (it.region || it.category), dates: longDate(it.date), headline: it.orgShort + ': ' + it.name },
        item: it, notes: { label: 'Notes', text: it.notes },
        sources: it.sources ? 'Sources: ' + it.sources.split(' | ').map(function (x) { return x.split(': ')[0]; }).join('; ') + '.' : CONFIG.SOURCES_LINE,
        items: [it] });
    });
  }

  compares.forEach(function (it) {
    var c = it.compare;
    screens.push({ pattern: 'compare',
      hero: { tracker: 'Compare  |  ' + (it.category || 'Side by side'), dates: longDate(it.date),
              headline: (c.a.short_name || c.a.name) + ' and ' + (c.b.short_name || c.b.name) },
      item: it, notes: { label: 'Notes', text: it.notes },
      sources: it.sources ? 'Sources: ' + it.sources.split(' | ').map(function (x) { return x.split(': ')[0]; }).join('; ') + '.' : CONFIG.SOURCES_LINE,
      items: [it] });
  });

  media.forEach(function (it) {
    screens.push({ pattern: 'media',
      hero: { tracker: 'Media  |  ' + it.source, dates: 'Posted ' + longDate(it.date), headline: it.title },
      item: it, notes: null,   // media drops the notes strip so the picture gets more height
      sources: CONFIG.SOURCES_LINE, items: [it] });
  });

  return { screens: screens };
}

// ============================================================================
// FIXED: shell behavior. Do not change.
// ============================================================================
var current = null, pending = null, index = 0, lastUpdated = null, rotateTimer = null;
var feedAccuracy = null;                                      // the feed's one accuracy figure, when it has one
var params = new URLSearchParams(location.search);
var holdScreen = params.get('screen');                        // ?screen=N holds one screen
if (params.get('bookmark') === 'clear') saveBookmark(null);  // ?bookmark=clear starts the board over from the top
var theme = (params.get('theme') || CONFIG.THEME) === 'light' ? 'light' : 'dark';   // ?theme= overrides CONFIG.THEME

// Pictures marked data-fit-box keep their shape inside the body: at most that many px wide,
// no taller than the body, and enlarged no more than 2x.
function sizePictures(root) {
  root.querySelectorAll('img[data-fit-box]').forEach(function (img) {
    function size() {
      var box = img.parentNode, body = root.querySelector('.wb-body');
      if (!img.naturalWidth || !body) return;
      var maxW = +img.dataset.fitBox, maxH = body.clientHeight;
      var k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 2);
      box.style.width = Math.round(img.naturalWidth * k) + 'px';
      box.style.height = Math.round(img.naturalHeight * k) + 'px';
      fitText(root);
    }
    if (img.complete) size(); else img.addEventListener('load', size);
  });
}
function fitText(root) {
  root.querySelectorAll('.wb-fit').forEach(function (el) {
    el.style.fontSize = '';
    var size = parseFloat(getComputedStyle(el).fontSize), min = parseFloat(el.dataset.min || size);
    while (el.scrollWidth > el.clientWidth + 1 && size > min) { size -= 1; el.style.fontSize = size + 'px'; }
  });
  root.querySelectorAll('.wb-notes-text').forEach(function (el) {
    var size = 22;
    el.style.display = 'block'; el.style.maxHeight = 'none';
    el.style.fontSize = size + 'px'; el.style.lineHeight = '28px';
    while (el.scrollHeight > 84 && size > 19) { size -= 1; el.style.fontSize = size + 'px'; el.style.lineHeight = Math.round(size * 1.27) + 'px'; }
    var lh = parseFloat(el.style.lineHeight);
    el.style.display = ''; el.style.maxHeight = '84px'; el.style.webkitLineClamp = String(Math.floor(84 / lh));
  });
  // Text blocks with a fixed height: shrink toward data-min, then end with an ellipsis
  root.querySelectorAll('.wb-clamp').forEach(function (el) {
    el.style.fontSize = ''; el.style.lineHeight = ''; el.style.webkitLineClamp = ''; el.style.display = 'block';
    var cs = getComputedStyle(el), size = parseFloat(cs.fontSize), ratio = parseFloat(cs.lineHeight) / size;
    var min = parseFloat(el.dataset.min || size), maxH = el.clientHeight;
    while (el.scrollHeight > maxH + 1 && size > min) { size -= 1; el.style.fontSize = size + 'px'; el.style.lineHeight = Math.round(size * ratio) + 'px'; }
    el.style.display = '';
    if (el.scrollHeight > maxH + 1) el.style.webkitLineClamp = String(Math.max(1, Math.floor(maxH / Math.round(size * ratio))));
  });
}
function render(s) {
  var host = document.getElementById('wb-host');
  if (!current || !s) { host.innerHTML = '<p class="wb-empty">Nothing to show yet</p>'; return; }
  host.innerHTML = screenHTML(s);
  host.querySelectorAll('img[data-name]').forEach(function (img) {
    img.addEventListener('error', function () {
      var span = document.createElement('span');
      span.className = 'wb-fallback'; span.textContent = img.dataset.name;
      img.replaceWith(span);
    });
  });
  fitText(host);
  sizePictures(host);
  setTimeout(function () { fitText(host); }, 1200);   // again once logos and fonts settle
}
// Bookmark. OptiSigns reloads a web app from scratch each time its playlist comes back to it,
// so the board remembers the last screen that ran its full time and picks up at the next one.
// A screen cut off by the playlist counts as not shown and plays again next time.
// The place is saved on the player itself; if a player doesn't keep it, the board starts at the top.
function screenKey(s) { return s.key || [s.pattern, s.item && s.item.id || '', s.page || ''].join('|'); }
function bookmarkName() { return 'wb-bookmark:' + CONFIG.BOARD_TITLE; }
function saveBookmark(b) {
  try { if (b) localStorage.setItem(bookmarkName(), JSON.stringify(b)); else localStorage.removeItem(bookmarkName()); } catch (e) {}
}
function readBookmark() {
  try { return JSON.parse(localStorage.getItem(bookmarkName()) || 'null'); } catch (e) { return null; }
}
function markShown(i) {
  var s = current && current.screens[i];
  if (s) saveBookmark({ key: screenKey(s), index: i, at: new Date().toISOString() });
}
// The screen after the last one shown. If that screen is gone (the data changed), the same position instead.
function resumeIndex() {
  var b = readBookmark(), n = current ? current.screens.length : 0;
  if (!b || !n) return 0;
  for (var i = 0; i < n; i++) if (screenKey(current.screens[i]) === b.key) return (i + 1) % n;
  return isNum(b.index) ? (b.index + 1) % n : 0;
}
function show(i) {
  if (i >= (current ? current.screens.length : 0)) i = 0;
  if (i === 0 && pending) { current = pending; pending = null; }   // new data starts at the top of the loop
  index = i;
  render(current ? current.screens[index] : null);
  var bar = document.getElementById('wb-timer');
  bar.style.transition = 'none'; bar.style.width = '0%';
  void bar.offsetWidth;
  bar.style.transition = 'width ' + CONFIG.SECONDS_PER_SCREEN + 's linear'; bar.style.width = '100%';
}
function startRotation() {
  clearInterval(rotateTimer);
  if (holdScreen !== null) { index = Math.min(+holdScreen || 0, Math.max(current.screens.length - 1, 0)); render(current.screens[index]); return; }
  show(resumeIndex());
  rotateTimer = setInterval(function () { markShown(index); show(index + 1); }, CONFIG.SECONDS_PER_SCREEN * 1000);
}
function timeText(dt) { return dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function tickClock() {
  var now = new Date();
  document.getElementById('wb-time').textContent = timeText(now);
  document.getElementById('wb-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function setStatus(live, text) {
  document.getElementById('wb-dot').className = 'wb-dot' + (live ? '' : ' is-off');
  document.getElementById('wb-status').textContent = text || (lastUpdated
    ? (live ? 'Live  ·  Updated ' : 'Offline  ·  Data from ') + timeText(lastUpdated)
    : 'Connecting');
}
function accept(list) {
  var built = buildScreens(Array.isArray(list) ? list : []);
  if (current) pending = built; else { current = built; startRotation(); }
}
function load() {
  if (!CONFIG.FEED_URL) { accept(SAMPLE_DATA); setStatus(true, 'Sample data'); return; }
  fetch(CONFIG.FEED_URL + (CONFIG.FEED_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (text) {
      var out = readFeed(text);
      var list = Array.isArray(out) ? out : (out && out.items) || [];
      feedAccuracy = Array.isArray(out) ? null : toPercent(out && out.accuracy);
      lastUpdated = new Date(); setStatus(true); accept(list);
    })
    .catch(function () { setStatus(false, lastUpdated ? '' : 'Offline  ·  Feed not reached'); if (!current) render(null); });
}
function scaleToScreen() {
  var b = document.getElementById('wb-board');
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  b.style.transform = 'scale(' + s + ')';
  b.style.left = (window.innerWidth - 1920 * s) / 2 + 'px';
  b.style.top = (window.innerHeight - 1080 * s) / 2 + 'px';
}

document.documentElement.setAttribute('data-theme', theme);
document.title = CONFIG.BOARD_TITLE;
document.getElementById('wb-title').textContent = CONFIG.BOARD_TITLE;
scaleToScreen();
window.addEventListener('resize', scaleToScreen);
tickClock(); setInterval(tickClock, 1000);
setStatus(false);
load(); setInterval(load, CONFIG.REFRESH_MINUTES * 60 * 1000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (current) render(current.screens[index]); });
</script>
